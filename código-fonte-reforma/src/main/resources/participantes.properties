# De-para CNPJ/CPF = COD_PART, usado para montar o COD_FIS_JUR ("M" + COD_PART)
# dos arquivos SAFX04/07/08/49 na conversao a partir de XML.
#
# Por que existe: no fluxo SPED o COD_FIS_JUR sai do COD_PART do registro 0150,
# um codigo interno do ERP (ex.: 9003065) que nao e derivavel do CNPJ. O XML
# fiscal nao traz esse codigo. Sem este de-para, o mesmo participante entraria
# com chaves diferentes conforme a origem e o MasterSAF ficaria com cadastro
# duplicado.
#
# Cadastro opcional: quando o CNPJ nao esta aqui, o proprio CNPJ e usado como
# codigo e a conversao emite um aviso ao final (ela nao aborta).
#
# Exemplo:
# 46754545000194=9003065
