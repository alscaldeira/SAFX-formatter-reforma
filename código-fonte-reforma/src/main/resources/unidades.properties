# De-para de unidade de medida do XML para a unidade cadastrada no MasterSAF.
# Aplicado ao uCom do item, que alimenta os campos 17 (COD_UND_PADRAO) e 25
# (COD_MEDIDA) do SAFX08 - os dois sao campos-chave e nao podem divergir.
#
# A NF-e chega a escrever a mesma unidade de duas formas no mesmo item
# (uCom = TO e uTrib = TON), dai a normalizacao.
TON=TO
TONELADA=TO
UNID=UN
UNIDADE=UN
