# De-para CNPJ = [COD_EMPRESA/]COD_ESTAB (campos 1 e 2 dos arquivos SAFX07/08/49).
# O codigo do estabelecimento vem do cadastro do MasterSAF e nao e derivavel do
# CNPJ, por isso cada estabelecimento precisa estar listado aqui.
# Para cadastrar um novo estabelecimento sem recompilar, copie este arquivo para
# a pasta onde o programa e executado (a mesma onde os SAFXnn.txt sao gerados).
#
# Sem barra, assume-se COD_EMPRESA "001":
#   72977242000140=0001      -> empresa 001, estabelecimento 0001
# Com barra, a empresa e explicita (necessario quando o lote tem mais de uma):
#   42105890000901=002/0001  -> empresa 002, estabelecimento 0001
72977242000140=0001
72977242000302=0003
72977242000493=0005
